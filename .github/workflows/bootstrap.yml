name: Bootstrap checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - name: Select preinstalled cached Python (no installation or fallback)
        env:
          PYTHON_MINOR: ${{ matrix.python-version }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          selected=''
          for candidate in "${RUNNER_TOOL_CACHE:?}/Python/${PYTHON_MINOR}."*/x64/bin/python; do
            if [[ -x "$candidate" ]] && "$candidate" -B -E -S -c \
              'import os, sys; assert ".".join(map(str, sys.version_info[:2])) == os.environ["PYTHON_MINOR"]'; then
              selected="$candidate"
              break
            fi
          done
          if [[ -z "$selected" ]]; then
            echo 'Required preinstalled Python is absent; installation is not permitted.' >&2
            exit 1
          fi
          printf '%s\n' "${selected%/*}" >> "$GITHUB_PATH"
          "$selected" -B -E -S --version
      - name: Validate integration metadata and setup safeguards (not inference)
        run: python -m unittest discover -s tests -v
      - name: Validate pinned audit citation metadata (no source fetch)
        run: python scripts/check_source_anchors.py
      - name: Check incomplete analytical budget reference (not measured feasibility)
        run: python scripts/resource_budget.py
      - name: Check synthetic partial-tensor budget arithmetic (not a placement result)
        run: |
          python scripts/resource_budget_v2.py tests/fixtures/resource-budget-v2-full-coverage.json --strict
          python scripts/resource_budget_v2.py tests/fixtures/resource-budget-v2-partial-hot-subset.json
          strict_status=0
          python scripts/resource_budget_v2.py tests/fixtures/resource-budget-v2-partial-hot-subset.json --strict || strict_status=$?
          test "$strict_status" -eq 1
      - name: Check partial CPU evidence template (not a CPU experiment)
        run: python scripts/check_cpu_evidence.py
      - name: Validate recorded packed-oracle acceptance receipt (no source execution)
        run: python scripts/check_packed_oracle.py --strict-receipt
      - name: Validate synthetic GGUF header inventory (JSON only, no source execution)
        run: python scripts/check_gguf_inventory.py
      - name: Show source plan without fetching dependencies
        run: python scripts/sop.py bootstrap
