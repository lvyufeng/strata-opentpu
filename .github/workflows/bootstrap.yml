name: Bootstrap checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate integration metadata and setup safeguards (not inference)
        run: python -m unittest discover -s tests -v
      - name: Show source plan without fetching dependencies
        run: python scripts/sop.py bootstrap
